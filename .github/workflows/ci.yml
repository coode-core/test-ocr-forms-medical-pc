name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync
      - name: Tests
        run: uv run pytest
      - name: CLI smoke
        run: uv run pc --help

  windows-installer-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.ps1
        shell: pwsh
        run: ./install.ps1 -SkipBrowser
      - name: Launcher
        shell: cmd
        run: pc.cmd --help
